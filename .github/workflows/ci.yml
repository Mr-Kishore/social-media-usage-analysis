name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Syntax & Compilation Check
        run: |
          python -m py_compile run.py app.py src/__init__.py src/generate_data.py src/analyze.py

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      - name: Run CLI Pipeline (Synthetic Mode)
        run: |
          python run.py --data synthetic

      - name: Run CLI Pipeline (Empirical Real Data Mode)
        run: |
          python run.py --data real

      - name: Verify 300 DPI Exported Charts
        run: |
          test -f charts/chart1_platform_usage.png
          test -f charts/chart2_daily_usage_hist.png
          test -f charts/chart3_age_group_usage.png
          test -f charts/chart4_study_vs_usage.png
          test -f charts/chart5_sleep_vs_usage.png
          test -f charts/chart6_usage_vs_performance.png
          echo "All 6 required 300 DPI analytical charts verified successfully."

      - name: Upload Analytical Charts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: analytical-charts
          path: charts/*.png
          if-no-files-found: error
